<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>LUNAR LANDER</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: "Courier New", monospace;
            cursor: none;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            cursor: none;
        }
        #game {
            width: min(100vw, calc(100vh * 800 / 600));
            height: min(100vh, calc(100vw * 600 / 800));
            background: #000;
            cursor: none;
            display: block;
            /* True vectors — crisp at any size */
            shape-rendering: geometricPrecision;
        }
        .scanline {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0) 50%,
                rgba(0, 0, 0, 0.1) 50%
            );
            background-size: 100% 4px;
            z-index: 2;
        }
        #fsHint {
            position: fixed;
            bottom: 10px;
            right: 14px;
            color: #555;
            font-size: 12px;
            z-index: 3;
            pointer-events: none;
            letter-spacing: 0.04em;
        }
        #fsHint.touch-hide { display: none; }

        /* Subtle iPad / touch chrome — no labels, no button boxes */
        #touchControls {
            position: absolute;
            width: min(100vw, calc(100vh * 800 / 600));
            height: min(100vh, calc(100vw * 600 / 800));
            pointer-events: none;
            z-index: 4;
            display: none;
        }
        #touchControls.on { display: block; }
        .touch-rotate {
            pointer-events: auto;
            position: absolute;
            left: max(12px, env(safe-area-inset-left, 0px));
            bottom: max(16px, env(safe-area-inset-bottom, 0px));
            width: min(34%, 168px);
            aspect-ratio: 1;
            border-radius: 50%;
            border: 1px solid rgba(221, 221, 221, 0.16);
            background: rgba(221, 221, 221, 0.03);
            box-sizing: border-box;
            touch-action: none;
        }
        .touch-rotate.active-left,
        .touch-rotate.active-right {
            border-color: rgba(221, 221, 221, 0.32);
            background: rgba(221, 221, 221, 0.06);
        }
        .touch-thrust {
            pointer-events: auto;
            position: absolute;
            right: max(14px, env(safe-area-inset-right, 0px));
            bottom: max(20px, env(safe-area-inset-bottom, 0px));
            width: min(14%, 52px);
            height: min(40%, 230px);
            touch-action: none;
        }
        .touch-thrust-track {
            position: absolute;
            left: 50%;
            top: 8px;
            bottom: 8px;
            width: 1px;
            margin-left: -0.5px;
            background: rgba(221, 221, 221, 0.2);
        }
        .touch-thrust-knob {
            position: absolute;
            left: 50%;
            width: 26px;
            height: 26px;
            margin-left: -13px;
            border-radius: 50%;
            border: 1px solid rgba(221, 221, 221, 0.28);
            background: rgba(221, 221, 221, 0.07);
            bottom: 8px;
            box-sizing: border-box;
        }
        .touch-thrust.active .touch-thrust-knob {
            border-color: rgba(221, 221, 221, 0.45);
            background: rgba(221, 221, 221, 0.12);
        }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="fsHint">F — FULL SCREEN</div>
    <div id="gameContainer">
        <svg id="game" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lunar Lander">
            <rect width="800" height="600" fill="#000"/>
            <g id="world">
                <g id="stars"></g>
                <polyline id="terrainLine" fill="none" stroke="#ddd" stroke-width="1.25" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
                <g id="terrainDots"></g>
                <g id="padLabels"></g>
                <g id="debrisLayer"></g>
                <g id="landerG"></g>
            </g>
            <g id="hud" display="none">
                <g id="hudVectors"></g>
                <g id="landerIcon"></g>
            </g>
            <text id="lowFuel" x="400" y="200" text-anchor="middle" fill="#ddd" font-family="Courier New, monospace" font-size="22" display="none">LOW ON FUEL</text>
            <g id="messages" display="none"></g>
            <text id="tip" x="400" y="584" text-anchor="middle" fill="#ddd" fill-opacity="0.65" font-family="Courier New, monospace" font-size="12" display="none">↑/W: THRUST    ←→/A D: ROTATE    SPACE: PAUSE    ESC: MENU    C: COIN</text>
            <g id="attract" display="none">
                <g id="attractLander" transform="translate(400 100)"></g>
                <g id="attractVectors"></g>
            </g>
            <g id="initialsEntry" display="none">
                <g id="initialsVectors"></g>
            </g>
        </svg>
        <div id="touchControls" aria-hidden="true">
            <div id="touchRotate" class="touch-rotate"></div>
            <div id="touchThrust" class="touch-thrust">
                <div class="touch-thrust-track"></div>
                <div id="touchThrustKnob" class="touch-thrust-knob"></div>
            </div>
        </div>
    </div>

    <script>
        const W = 800;
        const H = 600;

        // --- Session / game state ---
        // playing | message | attract | initials
        let gameState = 'attract';
        let paused = false;
        let pauseStartedAt = 0;
        let score = 0;
        let time = 0;
        let startTime = 0;
        let messageLines = [];
        let messageTimer = 0;
        let debris = [];
        let lowFuelFlash = 0;
        // Set on landing/crash; shown under center timer until next flight
        let impactSpeeds = null; // { h, v }

        // HIGH SCORES leaderboard
        let topScores = []; // [{ initials, score }]
        let topScoresLoaded = false;
        // Initials entry (arcade 3-letter)
        let entryInitials = ['A', 'A', 'A'];
        let entryIndex = 0;
        let entryBlink = 0;
        let entrySubmitting = false;

        // Attract-mode demo flight (AI pilot on the live playfield)
        const demo = {
            active: false,
            phase: 'fly', // fly | wait
            waitTimer: 0,
            targetPad: null,
            skill: 0.7,   // 0..1 — lower → messier flying / more crashes
            style: 'land', // 'land' | 'crash'
            // Thrust pulse: coast most of the time, short burns when needed
            burnLeft: 0,
            coastLeft: 0
        };

        // Gear / silhouette in local units (× lander.size/10). Sized to fit pads
        // when small, but drawn a bit larger for readability when zoomed.
        const lander = {
            x: 120,
            y: 90,
            vx: 0,
            vy: 0,
            rotation: 0,
            fuel: 0,
            thrusting: false,
            // Base size for wide view (+15%); world-space shrink with zoom (see landerScale)
            size: 7 * 1.15
        };

        // Physics in px/frame; HUD numbers scaled separately.
        // Vertical coast (original): from VSPEED 0, +40 in 4s → g = 10 HUD/s²
        // Horizontal/vertical coast: linear drag (reduction/s ≈ 0.15 · speed)
        // Drag applies on both H and V when engines off (Training atmosphere).
        // Thrust sample: HSPEED 128→73 / 2.5s at ~45° → full thrust ≈ 31.1
        //
        // === FEEL TUNABLES (HUD units / second² unless noted) ===
        // Physics is dt-based so these rates hold at any display refresh rate.
        const ALT_SCALE = 5.5;            // HUD altitude from pixel clearance (~2200 at spawn)
        const ALT_PER_VSPEED = 732 / 604; // k from paired sample
        const SPEED_SCALE = ALT_SCALE * 60 / ALT_PER_VSPEED;
        const SPAWN_ALT_HUD = 2200;
        const SPAWN_HSPEED_HUD = 180;
        const SPAWN_VSPEED_HUD = 10;
        const GRAVITY_HUD = 12;
        // Full thrust at 45° up sample → (GRAVITY+6)·√2; +25% for Training feel
        const THRUST_HUD = (GRAVITY_HUD + 30 / 5) * Math.SQRT2 * 1.25;
        // Training atmosphere: linear drag per axis, engines off.
        // d(speed)/dt ≈ −DRAG_K · speed  (≈1/s at 10, ≈30/s at 200)
        const DRAG_K_H = 0.09;
        const DRAG_K_V = 0.09;
        const ROTATION_RATE = 0.038;      // rad per 1/60s tick (same feel as before)
        const FUEL_THRUST = 0.22;         // fuel per 1/60s tick while thrusting
        const FUEL_ROTATE = 0.05;         // fuel per 1/60s tick while turning
        const gravity = GRAVITY_HUD / (SPEED_SCALE * 60);
        const thrustPower = THRUST_HUD / (SPEED_SCALE * 60);
        const rotationRate = ROTATION_RATE;

        // Approach zoom: wide view is a fixed camera (ship moves, terrain does not
        // scroll). Below ZOOM_START altitude we scale about a locked world X so the
        // landscape stays put and the ship drifts within the close-up.
        const ZOOM_START_ALT_HUD = 280;   // engage zoom below this altitude
        const ZOOM_END_ALT_HUD = 340;     // hysteresis: fully disengage only above this
        const ZOOM_MAX = 3.8;
        let viewZoom = 1;
        let zoomAnchorX = 0;
        let zoomAnchored = false;
        let zoomWanted = false;          // hysteresis latch for altitude engage/disengage
        let zoomTargetSmooth = 1;        // low-passed target to avoid terrain flicker
        let prevLanderX = 0;             // detect world wrap while zoomed


        // Landing thresholds (displayed HUD speeds). Manual crash cutoffs: V>15 or H>31.
        // Great/good are stricter scoring bands under that ceiling.
        const GREAT_V = 5;
        const GREAT_H = 8;
        const GOOD_V = 10;
        const GOOD_H = 20;
        const HARD_V = 15;               // manual: crash if vertical exceeds 15
        const HARD_H = 31;               // manual: crash if horizontal exceeds 31
        const UPRIGHT_GREAT = 0.25;
        const UPRIGHT_GOOD = 0.35;
        const UPRIGHT_HARD = 0.5;

        const FUEL_PER_COIN = 750;
        const LOW_FUEL = 90;
        const GREAT_FUEL_BONUS = 50;      // fuel awarded on great/good landings
        const CRASH_POINTS = 5;          // manual ~5
        const HARD_POINTS = 15;          // manual ~15 (× pad multiplier)
        const BASE_LAND_POINTS = 50;     // manual ~50 for good/great (× pad multiplier)

        // End-of-round copy (slash in source notes = new line; blank = empty line)
        const SAFE_LAND_MSGS = [
            ['CONGRATULATIONS', 'THE COLUMBIA HAS LANDED'],
            ['CONGRATULATIONS', 'THE EAGLE HAS LANDED'],
            ['CONGRATULATIONS', 'YOU HAVE LANDED'],
            ['CONGRATULATIONS', 'THAT WAS A GREAT LANDING']
        ];
        const HARD_LAND_MSGS = [
            ['YOU LANDED HARD', 'YOU ARE HOPELESSLY MAROONED'],
            ['YOU LANDED HARD', 'YOUR TRIP IS ONE WAY']
        ];
        // ### → fuel units lost at crash time
        const CRASH_MSGS = [
            [
                'AUXILIARY FUEL TANKS DESTROYED',
                '### FUEL UNITS LOST',
                '',
                'YOU JUST DESTROYED A 100 MEGABUCK LANDER'
            ],
            [
                'AUXILIARY FUEL TANKS DESTROYED',
                '### FUEL UNITS LOST',
                '',
                'YOU CREATED A TWO MILE CRATER'
            ],
            [
                'AUXILIARY FUEL TANKS DESTROYED',
                '### FUEL UNITS LOST',
                '',
                'DESTROYED'
            ]
        ];

        function pickMessage(pool) {
            return pool[Math.floor(Math.random() * pool.length)].slice();
        }

        function crashMessageLines(fuelLost) {
            if (fuelLost <= 0) return ['DESTROYED'];
            return pickMessage(CRASH_MSGS).map((line) =>
                line.replace('###', String(fuelLost))
            );
        }

        const terrain = [];
        const landingPads = [];

        // --- Arcade ship geometry (local coords, nose up) ---
        // Digitized via trace-ship.html from ship-closeup.png (normalized to foot span ≈ 12).
        const LANDER_FOOT_X = 6.0;
        const LANDER_FOOT_Y = 4.59;
        const LANDER_FOOT_HALF = 1.2;
        const LANDER_ENG_TIP_Y = 2.8; // flame origin (engine triangle not in this trace)

        // Traced segments in local units (scale s applied at draw time)
        const SHIP_SEGS = [
            [[-1.054, -5.86], [1.054, -5.843]],
            [[1.054, -5.843], [3.107, -3.908]],
            [[3.107, -3.908], [3.142, -1.64]],
            [[3.142, -1.64], [0.887, -0.048]],
            [[0.887, -0.048], [-0.95, -0.025]],
            [[-0.95, -0.025], [-3.033, -1.741]],
            [[-3.033, -1.741], [-3.105, -3.891]],
            [[-3.105, -3.891], [-1.054, -5.86]],
            [[3.084, -0.061], [3.065, 1.642]],
            [[3.065, 1.642], [-3.299, 1.626]],
            [[-3.299, 1.626], [-3.222, -0.038]],
            [[-3.222, -0.038], [3.084, -0.061]],
            [[-0.95, -0.025], [-1.28, 1.469]],
            [[-1.28, 1.469], [-2.607, 3.895]],
            [[-2.607, 3.895], [2.753, 3.939]],
            [[2.753, 3.939], [1.402, 1.448]],
            [[1.402, 1.448], [0.887, -0.048]],
            [[-3.299, 1.626], [-4.661, 4.517]],
            [[-6.0, 4.517], [-3.724, 4.546]],
            [[3.065, 1.642], [4.621, 4.49]],
            [[3.879, 4.538], [5.626, 4.586]]
        ];

        // Rigid crash components — index ranges into SHIP_SEGS (main arcade pieces)
        const SHIP_PARTS = [
            { name: 'cabin',  from: 0,  to: 8  }, // command pod outline
            { name: 'engine', from: 8,  to: 12 }, // mid body / engine box
            { name: 'nozzle', from: 12, to: 17 }, // thruster diamond
            { name: 'legL',   from: 17, to: 19 }, // left strut + foot
            { name: 'legR',   from: 19, to: 21 }  // right strut + foot
        ];

        function getLanderSegments(s) {
            return SHIP_SEGS.map(([a, b]) => [
                [a[0] * s, a[1] * s],
                [b[0] * s, b[1] * s]
            ]);
        }

        /** Scaled segment lists for each rigid part (local lander coords). */
        function getLanderParts(s) {
            return SHIP_PARTS.map(part => {
                const segs = SHIP_SEGS.slice(part.from, part.to).map(([a, b]) => [
                    [a[0] * s, a[1] * s],
                    [b[0] * s, b[1] * s]
                ]);
                let sx = 0, sy = 0, n = 0;
                for (const [a, b] of segs) {
                    sx += a[0] + b[0];
                    sy += a[1] + b[1];
                    n += 2;
                }
                const cx = n ? sx / n : 0;
                const cy = n ? sy / n : 0;
                // Segments relative to part centroid (for rigid-body spin)
                const local = segs.map(([a, b]) => [
                    [a[0] - cx, a[1] - cy],
                    [b[0] - cx, b[1] - cy]
                ]);
                return { name: part.name, cx, cy, segs: local };
            });
        }

        function getLanderNodes(s) {
            const pts = [];
            const seen = new Set();
            for (const [a, b] of getLanderSegments(s)) {
                for (const p of [a, b]) {
                    const k = p[0].toFixed(3) + ',' + p[1].toFixed(3);
                    if (seen.has(k)) continue;
                    seen.add(k);
                    pts.push(p);
                }
            }
            return pts;
        }

        function landerScale() {
            // Shrink with zoom, but never smaller than the narrowest 5X pad
            const gearSpanUnits = 2 * LANDER_FOOT_X;
            let min5x = Infinity;
            for (const p of POTENTIAL_PADS) {
                if (p.multiplier === 5) min5x = Math.min(min5x, p.x2 - p.x1);
            }
            const minScale = min5x / gearSpanUnits;
            const base = lander.size / 10;
            const z = Math.max(1, viewZoom);
            return Math.max(minScale, base / Math.pow(z, 0.55));
        }

        function landerHalfWidth() {
            return LANDER_FOOT_X * landerScale();
        }

        function landerFootDepth() {
            return LANDER_FOOT_Y * landerScale();
        }

        // --- Fixed arcade terrain (native-res digitize from footage; never regenerates) ---
        // ~500 vertices; all 14 flats are always landable; each round features 4 bonus labels.
        const FIXED_TERRAIN = [
            [0,400.0],[24.9,400.0],[30.3,400.0],[32.2,406.0],[38,405.9],[39.4,411.9],[42.5,412.2],[44,431.0],[48.4,449.4],[48.2,455.8],[49.2,459.9],[50.4,463.7],
            [51.4,467.3],[60.5,473.7],[63,486.3],[66.5,492.1],[72.7,498.3],[78.7,498.3],[84,491.9],[90,481.2],[95.4,474.2],[101.8,467.9],[105.3,460.7],[111.2,456.0],
            [113.7,448.6],[119.9,445.9],[125.6,436.7],[131.5,435.6],[137.4,430.9],[143.9,430.9],[149.3,432.3],[155.7,437.1],[157,443.4],[161.2,449.0],[163.1,455.6],[164.9,457.5],
            [167.1,461.3],[169.6,467.8],[173.5,473.8],[179.2,473.8],[184.4,461.0],[188.6,458.2],[192.5,460.8],[197,466.8],[200.5,479.9],[209.6,486.2],[210.1,504.5],[215.3,523.0],
            [215,529.0],[221.5,535.4],[232.8,535.4],[239,529.0],[245.4,522.6],[247.7,517.4],[254.1,510.9],[256.8,504.0],[263,501.9],[266,486.2],[269.2,473.3],[274.9,470.7],
            [280.3,464.5],[286.7,455.6],[292.7,443.4],[295.1,430.8],[301.3,424.6],[304.5,418.5],[306.5,412.1],[310.5,405.8],[316.6,405.8],[322.1,400.4],[328,389.4],[334.2,381.9],
            [337.4,369.5],[340.4,350.8],[340.1,338.6],[341.6,326.3],[344.8,313.7],[346.3,310.1],[352.2,308.1],[353,301.8],[357.9,295.0],[363.8,295.0],[365.6,301.5],[371.3,301.5],
            [373.5,307.9],[376,307.9],[379.9,310.2],[384.9,316.1],[387.6,329.6],[397,335.1],[398.9,341.9],[405.6,363.2],[411.6,364.6],[417.5,369.3],[419.2,375.1],[423.4,381.3],
            [425.1,387.2],[429.8,393.8],[435,393.8],[435.8,393.8],[437.3,411.9],[438.2,420.5],[441,430.9],[441,436.7],[446.9,436.7],[447.9,439.9],[448.6,442.7],[449.6,444.3],
            [453.1,449.1],[454.3,452.9],[454.8,456.4],[456.3,460.6],[459.3,467.0],[465.9,473.9],[466.7,492.5],[467.7,495.9],[470.4,505.3],[471.6,510.8],[471.1,517.2],[472.9,522.5],
            [477.6,529.3],[483.7,529.3],[486.2,541.5],[489.7,547.6],[495.1,553.5],[501.3,560.0],[524.8,560.0],[549,560.0],[550.2,551.0],[551.2,541.2],[557.4,528.9],[560.6,517.2],
            [563.6,517.1],[568.3,504.3],[572.5,501.7],[578.4,491.8],[584.3,491.0],[590,486.2],[596.4,486.2],[597.7,492.0],[599.9,498.3],[602.1,502.2],[605.3,513.8],[606.3,520.3],
            [611,526.1],[616,529.4],[619.9,535.4],[623.4,547.3],[632.8,553.7],[644.2,553.7],[656,555.3],[668.4,560.0],[691.1,560.0],[694.8,547.3],[697.8,528.7],[697.1,517.1],
            [703.5,516.9],[706.2,504.3],[712.4,498.2],[716.1,491.9],[717.3,485.9],[721.3,480.2],[727.5,479.9],[730.7,464.4],[733.4,452.2],[739.3,449.1],[745.5,455.5],[757.1,455.5],
            [763.3,449.1],[764.3,437.2],[769,421.0],[775.2,418.6],[777.1,411.9],[779.4,408.9],[781.1,405.9],[786,400.4],[800,400.4]
        ];
        // Multipliers fixed per site (arcade L→R): 4,3,4,4,2,5,4,5,5,2,5,2,2,3
        const POTENTIAL_PADS = [
            { id: 'P0', x1: 24.9, x2: 30.3, y: 400.0, multiplier: 4 },
            { id: 'P1', x1: 72.7, x2: 78.7, y: 498.3, multiplier: 3 },
            { id: 'P2', x1: 137.4, x2: 143.9, y: 430.9, multiplier: 4 },
            { id: 'P3', x1: 173.5, x2: 179.2, y: 473.8, multiplier: 4 },
            { id: 'P4', x1: 221.5, x2: 232.8, y: 535.4, multiplier: 2 },
            { id: 'P5', x1: 310.5, x2: 316.6, y: 405.8, multiplier: 5 },
            { id: 'P13', x1: 357.9, x2: 363.8, y: 295.0, multiplier: 4 },
            { id: 'P6', x1: 429.8, x2: 435.8, y: 393.8, multiplier: 5 },
            { id: 'P7', x1: 477.6, x2: 483.7, y: 529.3, multiplier: 5 },
            { id: 'P8', x1: 501.3, x2: 549, y: 560.0, multiplier: 2 },
            { id: 'P9', x1: 590, x2: 596.4, y: 486.2, multiplier: 5 },
            { id: 'P10', x1: 632.8, x2: 644.2, y: 553.7, multiplier: 2 },
            { id: 'P11', x1: 668.4, x2: 691.1, y: 560.0, multiplier: 2 },
            { id: 'P12', x1: 745.5, x2: 757.1, y: 455.5, multiplier: 3 }
        ];

        function shuffleInPlace(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                const t = arr[i];
                arr[i] = arr[j];
                arr[j] = t;
            }
            return arr;
        }

        function generateTerrain() {
            // Landscape is static. All 14 pads are always legal; each round a
            // random 4 keep their bonus multipliers (2X–5X labels). The rest
            // are still landable at unlabeled 1X.
            terrain.length = 0;
            for (const p of FIXED_TERRAIN) {
                terrain.push({ x: p[0], y: p[1] });
            }

            const featuredIds = new Set(
                shuffleInPlace(POTENTIAL_PADS.slice()).slice(0, 4).map(p => p.id)
            );

            landingPads.length = 0;
            const ordered = POTENTIAL_PADS.slice().sort((a, b) => a.x1 - b.x1);
            for (const pad of ordered) {
                const featured = featuredIds.has(pad.id);
                landingPads.push({
                    x1: pad.x1,
                    x2: pad.x2,
                    y: pad.y,
                    multiplier: featured ? pad.multiplier : 1,
                    labeled: featured,
                    id: pad.id
                });
            }
        }

        function getTerrainHeight(px) {
            // Polyline may backtrack in X — take the topmost surface at wx
            // (smallest y = first hit when falling from above).
            const wx = ((px % W) + W) % W;
            let best = null;
            for (let i = 0; i < terrain.length - 1; i++) {
                const a = terrain[i];
                const b = terrain[i + 1];
                const minX = Math.min(a.x, b.x);
                const maxX = Math.max(a.x, b.x);
                if (wx < minX || wx > maxX) continue;
                let y;
                if (maxX - minX < 1e-6) {
                    y = Math.min(a.y, b.y);
                } else {
                    const t = (wx - a.x) / (b.x - a.x);
                    y = a.y + (b.y - a.y) * t;
                }
                if (best === null || y < best) best = y;
            }
            return best !== null ? best : H;
        }

        // --- Stars ---
        const stars = [];
        function regenStars() {
            stars.length = 0;
            for (let i = 0; i < 28; i++) {
                stars.push({ x: Math.random() * W, y: Math.random() * 280 });
            }
        }
        regenStars();

        // --- Input ---
        const keys = {};
        function isThrustKey(key) {
            return key === 'ArrowUp' || key === 'w' || key === 'W';
        }
        function isLeftKey(key) {
            return key === 'ArrowLeft' || key === 'a' || key === 'A';
        }
        function isRightKey(key) {
            return key === 'ArrowRight' || key === 'd' || key === 'D';
        }
        function isControlKey(key) {
            return isThrustKey(key) || isLeftKey(key) || isRightKey(key);
        }
        function clearHeldKeys() {
            for (const k of Object.keys(keys)) keys[k] = false;
            touch.left = false;
            touch.right = false;
            touch.thrust = 0;
            syncTouchVisuals();
        }

        // --- Arcade SFX (Web Audio; low-fuel = synthesized F5 beeps) ---
        const SFX = {
            rumble: '/lunar-lander/rumble.wav',
            thrust: '/lunar-lander/thrust.wav',
            crash: '/lunar-lander/crash.wav'
        };
        // Middle C (C4, MIDI 60) + 17 semitones = F5 (MIDI 77) ≈ 698.46 Hz
        const LOWFUEL_HZ = 440 * Math.pow(2, (77 - 69) / 12);
        const LOWFUEL_BEEP_SEC = 0.09;
        const LOWFUEL_GAP_SEC = 0.07;
        const audio = {
            ctx: null,
            master: null,
            buffers: {},
            loops: {}, // name -> { src, gain }
            ready: false,
            loading: null,
            rumbleVol: 1.0,
            thrustVol: 0.85,
            crashVol: 0.9,
            lowFuelVol: 0.2,
            fadeIn: 0.12,
            fadeOut: 0.1
        };
        let lowFuelBeepPhase = -1;

        function ensureAudio() {
            if (audio.loading) return audio.loading;
            audio.loading = (async () => {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return false;
                audio.ctx = new AC();
                audio.master = audio.ctx.createGain();
                audio.master.gain.value = 0.75;
                audio.master.connect(audio.ctx.destination);
                await Promise.all(Object.keys(SFX).map(async (name) => {
                    try {
                        const res = await fetch(SFX[name]);
                        if (!res.ok) throw new Error(res.status);
                        const buf = await res.arrayBuffer();
                        let decoded = await audio.ctx.decodeAudioData(buf);
                        // Looping WAVs often click at the wrap — trim + crossfade seams.
                        if (name === 'rumble' || name === 'thrust') {
                            decoded = makeSeamlessLoopBuffer(decoded);
                        }
                        audio.buffers[name] = decoded;
                    } catch (err) {
                        console.warn('SFX load failed:', name, err);
                    }
                }));
                audio.ready = true;
                return true;
            })();
            return audio.loading;
        }

        /**
         * Rebuild a seamless loop for BufferSource.loop (hard wrap end→start).
         * Matches the first sample to the last sample of the kept range (exclusive end),
         * preferring near-zero crossings. Avoids crossfades that reintroduce clicks.
         */
        function makeSeamlessLoopBuffer(buffer, searchMs) {
            if (!audio.ctx || !buffer || buffer.numberOfChannels < 1) return buffer;
            searchMs = searchMs == null ? 150 : searchMs;
            const sr = buffer.sampleRate;
            const ch0 = buffer.getChannelData(0);
            const n = ch0.length;
            const search = Math.min(Math.floor(sr * searchMs / 1000), Math.floor(n / 4));
            if (search < 16 || n < search * 2 + 16) return buffer;

            let bestCost = Infinity;
            let bestI = 0;
            let bestJ = n; // exclusive end
            // j is exclusive; seam is ch0[j-1] → ch0[i] when looping
            for (let i = 1; i < search; i++) {
                const di = ch0[i] - ch0[i - 1];
                for (let j = n - search + 1; j <= n; j++) {
                    const last = j - 1;
                    if (last <= i) continue;
                    const dj = ch0[last] - ch0[last - 1];
                    const seam = Math.abs(ch0[i] - ch0[last]);
                    const slope = Math.abs(di - dj);
                    const nearZero = Math.abs(ch0[i]) + Math.abs(ch0[last]);
                    const cost = seam + 0.5 * slope + 0.15 * nearZero;
                    if (cost < bestCost) {
                        bestCost = cost;
                        bestI = i;
                        bestJ = j;
                    }
                }
            }

            if (bestJ - bestI < sr * 1.5) return buffer;

            const outLen = bestJ - bestI;
            const out = audio.ctx.createBuffer(buffer.numberOfChannels, outLen, sr);
            for (let c = 0; c < buffer.numberOfChannels; c++) {
                const src = buffer.getChannelData(c);
                const dst = out.getChannelData(c);
                for (let k = 0; k < outLen; k++) dst[k] = src[bestI + k];

                // If a tiny residual seam remains, ease the last few samples toward the first
                const first = dst[0];
                const last = dst[outLen - 1];
                const seam = Math.abs(first - last);
                if (seam > 0.002) {
                    const soften = Math.min(64, Math.floor(outLen / 20));
                    for (let k = 0; k < soften; k++) {
                        const t = (k + 1) / soften;
                        const idx = outLen - soften + k;
                        dst[idx] = dst[idx] * (1 - t) + first * t;
                    }
                }
            }
            return out;
        }

        function unlockAudio() {
            ensureAudio().then(() => {
                if (audio.ctx && audio.ctx.state === 'suspended') audio.ctx.resume();
            });
        }

        function audioNow() {
            return audio.ctx ? audio.ctx.currentTime : 0;
        }

        function rampGain(gainNode, target, seconds) {
            if (!gainNode || !audio.ctx) return;
            const now = audioNow();
            const g = gainNode.gain;
            g.cancelScheduledValues(now);
            // Use the live value — .value can lag automation; this avoids clicks
            const cur = g.value;
            g.setValueAtTime(Math.max(0.0001, cur), now);
            const t = Math.max(0.0001, target);
            if (seconds <= 0) g.setValueAtTime(t, now);
            else g.linearRampToValueAtTime(t, now + seconds);
        }

        function ensureLoop(name) {
            if (!audio.ready || !audio.buffers[name] || !audio.ctx) return null;
            let loop = audio.loops[name];
            if (loop) return loop;
            const gain = audio.ctx.createGain();
            gain.gain.value = 0.0001;
            gain.connect(audio.master);
            const src = audio.ctx.createBufferSource();
            src.buffer = audio.buffers[name];
            src.loop = true;
            src.connect(gain);
            try { src.start(0); } catch (_) {}
            loop = { src, gain, thrustTarget: 0.0001 };
            audio.loops[name] = loop;
            return loop;
        }

        function setRumblePlaying(on) {
            if (!audio.ready) return;
            const loop = ensureLoop('rumble');
            if (!loop) return;
            rampGain(loop.gain, on ? audio.rumbleVol : 0.0001, on ? 0.4 : 0.35);
        }

        function setThrustLevel(amount) {
            if (!audio.ready) return;
            const loop = ensureLoop('thrust');
            if (!loop) return;
            const a = Math.max(0, Math.min(1, amount));
            const target = a > 0.05 ? a * audio.thrustVol : 0.0001;
            // Don't re-schedule automation every frame — that clicks
            if (Math.abs(target - loop.thrustTarget) < 0.012) return;
            loop.thrustTarget = target;
            rampGain(loop.gain, target, target > 0.05 ? 0.09 : 0.12);
        }

        function playCrash() {
            if (!audio.ready || !audio.buffers.crash || !audio.ctx) return;
            setThrustLevel(0);
            const buf = audio.buffers.crash;
            const dur = buf.duration;
            const fade = Math.min(0.4, Math.max(0.15, dur * 0.45));
            const now = audioNow();
            const gain = audio.ctx.createGain();
            gain.gain.setValueAtTime(audio.crashVol, now);
            // Hold, then soften the abrupt arcade cutoff
            gain.gain.setValueAtTime(audio.crashVol, now + Math.max(0, dur - fade));
            gain.gain.linearRampToValueAtTime(0.0001, now + dur);
            gain.connect(audio.master);
            const src = audio.ctx.createBufferSource();
            src.buffer = buf;
            src.connect(gain);
            try { src.start(0); } catch (_) {}
            src.onended = () => {
                try { src.disconnect(); gain.disconnect(); } catch (_) {}
            };
        }

        function playBeepAt(freqHz, when, durSec, vol) {
            if (!audio.ctx || !audio.master) return;
            const osc = audio.ctx.createOscillator();
            const gain = audio.ctx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(freqHz, when);
            gain.gain.setValueAtTime(0.0001, when);
            gain.gain.linearRampToValueAtTime(vol, when + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, when + durSec);
            osc.connect(gain);
            gain.connect(audio.master);
            osc.start(when);
            osc.stop(when + durSec + 0.02);
        }

        /** Two short F5 beeps (middle C + 17 semitones). */
        function playLowFuelBeeps() {
            if (!audio.ready || !audio.ctx) return;
            const now = audioNow();
            const v = audio.lowFuelVol;
            playBeepAt(LOWFUEL_HZ, now, LOWFUEL_BEEP_SEC, v);
            playBeepAt(
                LOWFUEL_HZ,
                now + LOWFUEL_BEEP_SEC + LOWFUEL_GAP_SEC,
                LOWFUEL_BEEP_SEC,
                v
            );
        }

        function updateLowFuelAlarm(f) {
            if (gameState === 'playing' && !paused && lander.fuel > 0 && lander.fuel < LOW_FUEL) {
                lowFuelFlash += f;
                const phase = Math.floor(lowFuelFlash / 20);
                // Fire the double-beep when the on-screen warning blinks on
                if (phase !== lowFuelBeepPhase && phase % 2 === 0) {
                    lowFuelBeepPhase = phase;
                    playLowFuelBeeps();
                }
            } else {
                lowFuelBeepPhase = -1;
            }
        }

        function stopFlightAudio() {
            setThrustLevel(0);
            setRumblePlaying(false);
            lowFuelBeepPhase = -1;
        }

        function returnToAttract() {
            paused = false;
            pauseStartedAt = 0;
            lander.fuel = 0;
            lander.thrusting = false;
            debris = [];
            messageLines = [];
            messageTimer = 0;
            viewZoom = 1;
            zoomAnchored = false;
            zoomWanted = false;
            zoomTargetSmooth = 1;
            clearHeldKeys();
            impactSpeeds = null;
            // Esc abandons the run without HIGH SCORES entry
            score = 0;
            stopFlightAudio();
            gameState = 'attract';
            startDemoFlight();
        }

        function qualifiesForTopScores(s) {
            if (!Number.isFinite(s) || s <= 0) return false;
            if (topScores.length < 10) return true;
            return s > topScores[topScores.length - 1].score;
        }

        function startInitialsEntry() {
            stopDemo();
            stopFlightAudio();
            entryInitials = ['A', 'A', 'A'];
            entryIndex = 0;
            entryBlink = 0;
            entrySubmitting = false;
            paused = false;
            clearHeldKeys();
            gameState = 'initials';
        }

        async function loadTopScores() {
            try {
                const res = await fetch('/api/lunar-lander/scores');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                topScores = Array.isArray(data.scores) ? data.scores : [];
                topScoresLoaded = true;
            } catch (err) {
                console.warn('HIGH SCORES load failed:', err);
                topScoresLoaded = true;
            }
        }

        async function submitTopScore() {
            if (entrySubmitting) return;
            entrySubmitting = true;
            const initials = entryInitials.join('');
            const submitScore = score;
            try {
                const res = await fetch('/api/lunar-lander/scores', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ initials, score: submitScore })
                });
                const data = await res.json().catch(() => ({}));
                if (Array.isArray(data.scores)) topScores = data.scores;
                else await loadTopScores();
            } catch (err) {
                console.warn('HIGH SCORES submit failed:', err);
            }
            score = 0;
            entrySubmitting = false;
            gameState = 'attract';
            startDemoFlight();
        }

        function cycleEntryLetter(dir) {
            const A = 'A'.charCodeAt(0);
            const code = entryInitials[entryIndex].charCodeAt(0) - A;
            const next = (code + dir + 26) % 26;
            entryInitials[entryIndex] = String.fromCharCode(A + next);
        }

        function confirmEntryLetter() {
            if (entryIndex < 2) {
                entryIndex += 1;
                return;
            }
            submitTopScore();
        }

        function maybeEnterTopScoresOrAttract() {
            if (qualifiesForTopScores(score)) {
                stopDemo();
                startInitialsEntry();
            } else {
                score = 0;
                gameState = 'attract';
                startDemoFlight();
            }
        }

        function togglePause() {
            if (gameState !== 'playing') return;
            if (!paused) {
                paused = true;
                pauseStartedAt = Date.now();
                lander.thrusting = false;
                clearHeldKeys();
                setThrustLevel(0);
                setRumblePlaying(false);
            } else {
                // Keep TIME HUD honest across the pause
                startTime += Date.now() - pauseStartedAt;
                paused = false;
                pauseStartedAt = 0;
                setRumblePlaying(true);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (isControlKey(e.key) || e.key === ' ' || e.key === 'Escape') e.preventDefault();
            if (e.repeat) return;
            unlockAudio();
            keys[e.key] = true;

            if (gameState === 'initials') {
                if (e.key === 'Escape') {
                    score = 0;
                    gameState = 'attract';
                    startDemoFlight();
                    return;
                }
                if (entrySubmitting) return;
                if (isLeftKey(e.key)) { cycleEntryLetter(-1); return; }
                if (isRightKey(e.key)) { cycleEntryLetter(1); return; }
                if (isThrustKey(e.key) || e.key === 'Enter' || e.key === ' ') {
                    confirmEntryLetter();
                    return;
                }
                // Direct letter typing
                if (/^[a-zA-Z]$/.test(e.key)) {
                    entryInitials[entryIndex] = e.key.toUpperCase();
                    if (entryIndex < 2) entryIndex += 1;
                    else confirmEntryLetter();
                }
                return;
            }

            if (e.key === 'Escape') {
                returnToAttract();
                return;
            }
            if (e.key === ' ') {
                togglePause();
                return;
            }

            // Insert coin
            if (e.key === 'c' || e.key === 'C' || e.key === '5') {
                if (!paused) insertCoin();
            }
            // Advance from message / restart attempt when fuel remains
            if ((e.key === 'r' || e.key === 'R' || e.key === 'Enter') && gameState === 'message' && !paused) {
                beginNextRound();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (isControlKey(e.key) || e.key === ' ') e.preventDefault();
            keys[e.key] = false;
        });

        // Touch / iPad controls (subtle rotate disc + thrust lever)
        const touch = {
            left: false,
            right: false,
            thrust: 0, // 0..1 analog
            rotateId: null,
            thrustId: null,
            enabled: false
        };

        function isTouchPlayDevice() {
            const ua = navigator.userAgent || '';
            // iPadOS 13+ often reports as MacIntel with multi-touch
            const iPad = /iPad/.test(ua) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            const iPhone = /iPhone|iPod/.test(ua);
            const coarse = window.matchMedia &&
                window.matchMedia('(pointer: coarse)').matches;
            return iPad || iPhone || (coarse && navigator.maxTouchPoints > 0);
        }

        function syncTouchVisuals() {
            const rot = document.getElementById('touchRotate');
            const thr = document.getElementById('touchThrust');
            const knob = document.getElementById('touchThrustKnob');
            if (!rot || !thr || !knob) return;
            rot.classList.toggle('active-left', touch.left);
            rot.classList.toggle('active-right', touch.right);
            thr.classList.toggle('active', touch.thrust > 0.05);
            const track = thr.querySelector('.touch-thrust-track');
            if (!track) return;
            const trackH = track.clientHeight || 1;
            const knobH = knob.offsetHeight || 26;
            const travel = Math.max(1, trackH - knobH);
            // thrust 0 at bottom, 1 at top
            const yFromBottom = touch.thrust * travel;
            knob.style.bottom = (8 + yFromBottom) + 'px';
            knob.style.top = 'auto';
        }

        function setTouchControlsVisible(on) {
            const el = document.getElementById('touchControls');
            const hint = document.getElementById('fsHint');
            touch.enabled = !!on;
            if (el) el.classList.toggle('on', !!on);
            if (hint) hint.classList.toggle('touch-hide', !!on);
            if (!on) {
                touch.left = false;
                touch.right = false;
                touch.thrust = 0;
                touch.rotateId = null;
                touch.thrustId = null;
            }
            syncTouchVisuals();
        }

        function thrustAmount() {
            if (keys['ArrowUp'] || keys['w'] || keys['W']) return 1;
            return touch.thrust;
        }
        function thrustHeld() {
            return thrustAmount() > 0.06;
        }
        function leftHeld() {
            return keys['ArrowLeft'] || keys['a'] || keys['A'] || touch.left;
        }
        function rightHeld() {
            return keys['ArrowRight'] || keys['d'] || keys['D'] || touch.right;
        }

        function handleTouchUiAction() {
            // Shared gestures for modes that aren't continuous flight
            if (gameState === 'attract') {
                insertCoin();
                return true;
            }
            if (gameState === 'message' && !paused) {
                beginNextRound();
                return true;
            }
            return false;
        }

        function bindTouchControls() {
            const rot = document.getElementById('touchRotate');
            const thr = document.getElementById('touchThrust');
            if (!rot || !thr) return;

            function rotFromEvent(e, id) {
                const t = [...e.changedTouches].find(x => x.identifier === id) ||
                    (e.touches && [...e.touches].find(x => x.identifier === id));
                if (!t) return;
                const r = rot.getBoundingClientRect();
                const x = t.clientX - r.left;
                touch.left = x >= r.width * 0.5;
                touch.right = x < r.width * 0.5;
                syncTouchVisuals();
            }

            function thrustFromEvent(e, id) {
                const t = [...e.changedTouches].find(x => x.identifier === id) ||
                    (e.touches && [...e.touches].find(x => x.identifier === id));
                if (!t) return;
                const track = thr.querySelector('.touch-thrust-track');
                const r = (track || thr).getBoundingClientRect();
                const y = t.clientY - r.top;
                const amt = 1 - Math.max(0, Math.min(1, y / Math.max(1, r.height)));
                touch.thrust = amt;
                syncTouchVisuals();
            }

            rot.addEventListener('touchstart', (e) => {
                e.preventDefault();
                unlockAudio();
                if (!touch.enabled) setTouchControlsVisible(true);
                if (handleTouchUiAction()) return;
                if (gameState === 'initials') {
                    const t = e.changedTouches[0];
                    const r = rot.getBoundingClientRect();
                    if (t.clientX - r.left >= r.width * 0.5) cycleEntryLetter(-1);
                    else cycleEntryLetter(1);
                    return;
                }
                const t = e.changedTouches[0];
                touch.rotateId = t.identifier;
                rotFromEvent(e, t.identifier);
            }, { passive: false });

            rot.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (touch.rotateId == null) return;
                rotFromEvent(e, touch.rotateId);
            }, { passive: false });

            rot.addEventListener('touchend', (e) => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    if (t.identifier === touch.rotateId) {
                        touch.rotateId = null;
                        touch.left = false;
                        touch.right = false;
                        syncTouchVisuals();
                    }
                }
            }, { passive: false });

            rot.addEventListener('touchcancel', (e) => {
                touch.rotateId = null;
                touch.left = false;
                touch.right = false;
                syncTouchVisuals();
            }, { passive: false });

            thr.addEventListener('touchstart', (e) => {
                e.preventDefault();
                unlockAudio();
                if (!touch.enabled) setTouchControlsVisible(true);
                if (handleTouchUiAction()) return;
                if (gameState === 'initials') {
                    confirmEntryLetter();
                    return;
                }
                const t = e.changedTouches[0];
                touch.thrustId = t.identifier;
                thr.classList.add('active');
                thrustFromEvent(e, t.identifier);
            }, { passive: false });

            thr.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (touch.thrustId == null) return;
                thrustFromEvent(e, touch.thrustId);
            }, { passive: false });

            thr.addEventListener('touchend', (e) => {
                e.preventDefault();
                for (const t of e.changedTouches) {
                    if (t.identifier === touch.thrustId) {
                        touch.thrustId = null;
                        touch.thrust = 0;
                        thr.classList.remove('active');
                        syncTouchVisuals();
                    }
                }
            }, { passive: false });

            thr.addEventListener('touchcancel', () => {
                touch.thrustId = null;
                touch.thrust = 0;
                thr.classList.remove('active');
                syncTouchVisuals();
            }, { passive: false });

            // Reveal controls on first touch anywhere if we missed UA detection
            window.addEventListener('touchstart', () => {
                if (!touch.enabled) setTouchControlsVisible(true);
            }, { passive: true, once: true });
        }

        function insertCoin() {
            unlockAudio();
            if (gameState === 'attract') {
                // Fresh run — don't carry over demo's infinite fuel (9999)
                stopDemo();
                lander.fuel = FUEL_PER_COIN;
                beginFlight(true);
            } else {
                lander.fuel += FUEL_PER_COIN;
            }
        }

        function stopDemo() {
            demo.active = false;
            demo.phase = 'fly';
            demo.waitTimer = 0;
            demo.targetPad = null;
        }

        function startDemoFlight() {
            if (gameState !== 'attract') return;
            generateTerrain();
            regenStars();
            debris = [];
            messageLines = [];
            impactSpeeds = null;
            lander.x = 28;
            lander.y = getTerrainHeight(lander.x) - landerFootDepth() - (SPAWN_ALT_HUD / ALT_SCALE);
            if (lander.y < 78) lander.y = 78;
            lander.vx = SPAWN_HSPEED_HUD / SPEED_SCALE;
            lander.vy = SPAWN_VSPEED_HUD / SPEED_SCALE;
            lander.rotation = -Math.PI / 2;
            lander.thrusting = false;
            lander.fuel = 9999; // demo does not burn out
            viewZoom = 1;
            zoomAnchored = false;
            zoomWanted = false;
            zoomTargetSmooth = 1;
            prevLanderX = lander.x;
            demo.active = true;
            demo.phase = 'fly';
            demo.waitTimer = 0;
            demo.skill = 0.4 + Math.random() * 0.55;
            demo.style = Math.random() < 0.3 ? 'crash' : 'land';
            demo.burnLeft = 0;
            demo.coastLeft = 40 + Math.random() * 80; // start in freefall
            demo.targetPad = landingPads.length
                ? landingPads[Math.floor(Math.random() * landingPads.length)]
                : null;
        }

        /** Attract AI: tip / thrust toward a pad; skill/style decide success vs wreck. */
        function demoPilot() {
            const pad = demo.targetPad;
            if (!pad) return { thrust: false, left: false, right: false };

            const padCx = (pad.x1 + pad.x2) / 2;
            const dx = padCx - lander.x;
            const alt = altitudeHud();
            const hHud = lander.vx * SPEED_SCALE;
            const vHud = lander.vy * SPEED_SCALE;
            const skill = demo.style === 'crash' ? demo.skill * 0.45 : demo.skill;

            // Desired horizontal speed toward the pad; kill H when close
            let wantH = Math.max(-140, Math.min(140, dx * 0.4));
            if (Math.abs(dx) < 50) wantH *= 0.35;
            if (Math.abs(dx) < 18) wantH = 0;
            wantH += (1 - skill) * (Math.random() - 0.5) * 50;

            const errH = wantH - hHud;
            // Tip so thrust accelerates toward errH (sin(rot) > 0 → +vx)
            let wantRot = Math.max(-1.0, Math.min(1.0, errH * 0.009));
            if (alt < 90 && Math.abs(dx) < 35) wantRot *= 0.25;
            if (alt < 45 && Math.abs(dx) < 22) wantRot = 0;
            // Crash style: stay tipped / late corrections
            if (demo.style === 'crash' && alt > 60) {
                wantRot += (Math.random() - 0.5) * 0.5;
            }

            const rot = normalizeAngle(lander.rotation);
            const rotErr = normalizeAngle(wantRot - rot);
            let left = false;
            let right = false;
            if (rotErr > 0.07) right = true;
            else if (rotErr < -0.07) left = true;

            // --- Thrust: prefer freefall; only burn when needed, in short pulses ---
            // High alt: allow fast descent. Mid: moderate. Final approach: careful.
            let maxV;
            if (alt > 900) maxV = 90 + skill * 40;
            else if (alt > 400) maxV = 45 + skill * 25;
            else if (alt > 150) maxV = 22 + skill * 14;
            else maxV = 6 + skill * 8;

            const needBrake = vHud > maxV;
            const needH =
                Math.abs(errH) > 45 &&
                Math.abs(rotErr) < 0.4 &&
                Math.sign(Math.sin(rot) || rot) === Math.sign(errH) &&
                alt < 700;
            const needLand =
                alt < 70 && Math.abs(dx) < 32 && Math.abs(hHud) < 32 && vHud > 3;

            const wantBurn = needBrake || needH || needLand;

            // Advance pulse timers (called once per physics frame via updateDemo)
            if (demo.burnLeft > 0) {
                demo.burnLeft -= 1;
                if (demo.burnLeft <= 0) {
                    // After a burn, coast longer at high alt
                    const coast =
                        alt > 500 ? 50 + Math.random() * 90 :
                        alt > 150 ? 28 + Math.random() * 50 :
                        10 + Math.random() * 22;
                    demo.coastLeft = coast * (demo.style === 'crash' ? 1.35 : 1);
                }
            } else if (demo.coastLeft > 0) {
                demo.coastLeft -= 1;
            }

            let thrust = false;
            if (wantBurn) {
                if (demo.burnLeft > 0) {
                    thrust = true;
                } else if (demo.coastLeft <= 0) {
                    // Start a short burn pulse (landing burns a bit longer)
                    const pulse =
                        needLand ? 18 + Math.random() * 16 :
                        needBrake ? 12 + Math.random() * 18 :
                        8 + Math.random() * 12;
                    demo.burnLeft = pulse;
                    thrust = true;
                }
                // else: still coasting — freefall even if velocities are high
            }

            // Emergency: don't freefall into the ground while coasting
            if (alt < 100 && vHud > 18) thrust = true;
            if (alt < 40 && vHud > 5) thrust = true;

            // Crash-style: drop thrust near the surface
            if (demo.style === 'crash' && alt < 120 && Math.random() < 0.03) {
                thrust = false;
                demo.burnLeft = 0;
                demo.coastLeft = 20 + Math.random() * 40;
            }

            return { thrust, left, right };
        }

        function finishDemoTouchdown(crashed) {
            lander.thrusting = false;
            if (crashed) {
                spawnExplosion();
            } else {
                lander.vx = 0;
                lander.vy = 0;
                lander.rotation = 0;
            }
            demo.phase = 'wait';
            demo.waitTimer = crashed ? 160 : 110;
        }

        function updateDemo(f) {
            if (!demo.active) {
                startDemoFlight();
                return;
            }
            if (demo.phase === 'wait') {
                updateDebris(f);
                updateZoom(f);
                demo.waitTimer -= f;
                if (demo.waitTimer <= 0) startDemoFlight();
                return;
            }

            const ctrl = demoPilot();
            lander.thrusting = false;
            if (ctrl.thrust) {
                lander.vx += Math.sin(lander.rotation) * thrustPower * f;
                lander.vy -= Math.cos(lander.rotation) * thrustPower * f;
                lander.thrusting = true;
            }
            if (ctrl.left) applyRotation(-rotationRate * f);
            if (ctrl.right) applyRotation(rotationRate * f);

            lander.vy += gravity * f;
            if (!lander.thrusting) {
                const dtSec = f / 60;
                lander.vx *= Math.exp(-DRAG_K_H * dtSec);
                lander.vy *= Math.exp(-DRAG_K_V * dtSec);
            }
            lander.x += lander.vx * f;
            lander.y += lander.vy * f;
            if (lander.x < 0) lander.x = W;
            if (lander.x > W) lander.x = 0;

            updateZoom(f);
            checkCollision({ demo: true });
        }

        function beginFlight(freshSpawn) {
            stopDemo();
            generateTerrain();
            regenStars();
            debris = [];
            messageLines = [];
            time = 0;
            startTime = Date.now();
            lander.x = 28; // far left; just below HUD vertically
            // Place so HUD altitude matches arcade spawn (~2200)
            lander.y = getTerrainHeight(lander.x) - landerFootDepth() - (SPAWN_ALT_HUD / ALT_SCALE);
            if (lander.y < 78) lander.y = 78;
            lander.vx = SPAWN_HSPEED_HUD / SPEED_SCALE;
            lander.vy = SPAWN_VSPEED_HUD / SPEED_SCALE;
            // Arcade spawn: nose left, thrusters right (−90°)
            lander.rotation = -Math.PI / 2;
            lander.thrusting = false;
            viewZoom = 1;
            zoomAnchored = false;
            zoomWanted = false;
            zoomTargetSmooth = 1;
            prevLanderX = lander.x;
            paused = false;
            pauseStartedAt = 0;
            impactSpeeds = null;
            gameState = 'playing';
            setThrustLevel(0);
            setRumblePlaying(true);
        }

        function altitudePx() {
            return getTerrainHeight(lander.x) - lander.y - landerFootDepth();
        }

        function altitudeHud() {
            return Math.max(0, altitudePx() * ALT_SCALE);
        }

        function targetZoom() {
            if (gameState === 'initials') return 1;
            // Attract demo uses the same altitude zoom as play; idle attract stays 1×
            if (gameState === 'attract' && !(demo.active && demo.phase === 'fly')) return 1;
            if (gameState !== 'playing' && gameState !== 'attract' && gameState !== 'message') {
                return 1;
            }
            const alt = altitudeHud();

            // Hysteresis: engage below START, stay engaged until above END.
            // Prevents rapid in/out when altitude hovers near the threshold.
            if (!zoomWanted) {
                if (alt >= ZOOM_START_ALT_HUD) return 1;
                zoomWanted = true;
            } else if (alt >= ZOOM_END_ALT_HUD) {
                zoomWanted = false;
                return 1;
            }

            const t = 1 - Math.min(1, Math.max(0, alt / ZOOM_START_ALT_HUD));
            // Ease-in: mostly wide until close, then tightens
            const eased = t * t;
            let z = 1 + (ZOOM_MAX - 1) * eased;

            // Vertical fit: never zoom past what keeps ship + surface on screen
            const topMargin = 100;
            const bottomMargin = 40;
            const span = Math.max(40, altitudePx() + landerFootDepth() + 48);
            const maxFitY = (H - topMargin - bottomMargin) / span;
            z = Math.min(z, Math.max(1, maxFitY));

            // Horizontal fit: fixed X-anchor — ship must stay in frame as it drifts
            if (zoomAnchored) {
                const distX = Math.abs(lander.x - zoomAnchorX);
                const sideMargin = 36;
                const maxFitX = (W / 2 - sideMargin) / Math.max(8, distX + landerHalfWidth());
                z = Math.min(z, Math.max(1, maxFitX));
            }

            return z;
        }

        function updateZoom(f) {
            // World wrap (0↔W) would put the ship a full width from the anchor
            if (zoomAnchored && Math.abs(lander.x - prevLanderX) > W * 0.5) {
                zoomAnchorX = lander.x;
            }
            prevLanderX = lander.x;

            const tz = targetZoom();
            // Low-pass the target so jagged terrain altitude spikes don't pump zoom
            const kTarget = 1 - Math.pow(0.85, f == null ? 1 : f);
            zoomTargetSmooth += (tz - zoomTargetSmooth) * kTarget;

            // Lock horizontal anchor when we first leave 1× (landscape stays put)
            if (zoomTargetSmooth > 1.02 && !zoomAnchored) {
                zoomAnchorX = lander.x;
                zoomAnchored = true;
            }
            // Only drop the anchor once fully zoomed out (no transform cliff)
            if (zoomTargetSmooth <= 1.001 && viewZoom <= 1.001) {
                zoomAnchored = false;
            }

            const k = 1 - Math.pow(0.9, f == null ? 1 : f);
            viewZoom += (zoomTargetSmooth - viewZoom) * k;
            if (viewZoom < 1.001) viewZoom = 1;
        }

        function beginNextRound() {
            debris = [];
            messageLines = [];
            if (lander.fuel <= 0) {
                maybeEnterTopScoresOrAttract();
                return;
            }
            beginFlight(false);
        }

        function showMessage(lines, durationFrames) {
            messageLines = lines;
            messageTimer = durationFrames || 180;
            gameState = 'message';
            setThrustLevel(0);
            setRumblePlaying(false);
        }

        function normalizeAngle(a) {
            return ((a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
        }

        function applyRotation(delta) {
            // Discrete turn steps can jump past upright (0); snap when crossing.
            const prev = normalizeAngle(lander.rotation);
            let next = normalizeAngle(prev + delta);
            if (prev !== 0 && Math.sign(prev) !== Math.sign(next) &&
                Math.abs(prev) + Math.abs(next) < Math.PI) {
                next = 0;
            }
            lander.rotation = next;
        }

        // --- Explosion: break into rigid main components ---
        function spawnExplosion() {
            playCrash();
            debris = [];
            const s = landerScale();
            const parts = getLanderParts(s);
            const cos = Math.cos(lander.rotation);
            const sin = Math.sin(lander.rotation);
            // Capture impact velocity before caller zeros lander.vx/vy
            const impactVx = lander.vx;
            const impactVy = lander.vy;
            // Shared bounce off the surface: keep H, reverse V (all pieces go roughly this way)
            const bounceVx = impactVx;
            const bounceVy = -Math.abs(impactVy) * 0.75 - 0.35;

            for (const part of parts) {
                // Part centroid in world space (starting positions stay apart)
                const wx = lander.x + part.cx * cos - part.cy * sin;
                const wy = lander.y + part.cx * sin + part.cy * cos;
                // Small per-piece scatter around the shared bounce direction
                const randVx = (Math.random() - 0.5) * 0.7;
                const randVy = (Math.random() - 0.5) * 0.5;
                debris.push({
                    x: wx,
                    y: wy,
                    vx: bounceVx + randVx,
                    vy: bounceVy + randVy,
                    angle: lander.rotation + (Math.random() - 0.5) * 0.35,
                    spin: (Math.random() - 0.5) * 0.22,
                    segs: part.segs,
                    life: 1
                });
            }
        }

        function updateDebris(f) {
            for (const d of debris) {
                d.vy += gravity * 1.4 * f;
                d.x += d.vx * f;
                d.y += d.vy * f;
                d.angle += d.spin * f;
                d.vx *= Math.pow(0.995, f);
                d.life -= 0.006 * f;
            }
            debris = debris.filter(d => d.life > 0 && d.y < H + 40);
        }

        // --- Update ---
        // f = dt * 60: physics units are “per 1/60s tick” so rates match HUD/s at any FPS.
        function update(dt) {
            const f = Math.min(dt * 60, 3); // clamp after tab-switch hitches
            if (gameState === 'initials' || paused) return;

            if (gameState === 'attract') {
                updateDemo(f);
                return;
            }

            if (gameState === 'message') {
                updateDebris(f);
                updateZoom(f);
                messageTimer -= f;
                if (messageTimer <= 0) {
                    beginNextRound();
                }
                return;
            }

            if (gameState !== 'playing') return;

            time = Math.floor((Date.now() - startTime) / 1000);
            lander.thrusting = false;

            if (lander.fuel > 0) {
                const tAmt = thrustAmount();
                if (tAmt > 0.06) {
                    lander.vx += Math.sin(lander.rotation) * thrustPower * f * tAmt;
                    lander.vy -= Math.cos(lander.rotation) * thrustPower * f * tAmt;
                    lander.fuel = Math.max(0, lander.fuel - FUEL_THRUST * f * tAmt);
                    lander.thrusting = true;
                }
                setThrustLevel(paused ? 0 : tAmt);
                if (leftHeld()) {
                    applyRotation(-rotationRate * f);
                    lander.fuel = Math.max(0, lander.fuel - FUEL_ROTATE * f);
                }
                if (rightHeld()) {
                    applyRotation(rotationRate * f);
                    lander.fuel = Math.max(0, lander.fuel - FUEL_ROTATE * f);
                }
            } else {
                setThrustLevel(0);
            }

            lander.vy += gravity * f;

            // Training atmosphere: linear drag per axis when engines off
            if (!lander.thrusting) {
                const dtSec = f / 60;
                lander.vx *= Math.exp(-DRAG_K_H * dtSec);
                lander.vy *= Math.exp(-DRAG_K_V * dtSec);
                if (Math.abs(lander.vx) * SPEED_SCALE < 0.05) lander.vx = 0;
                if (Math.abs(lander.vy) * SPEED_SCALE < 0.05) lander.vy = 0;
            }

            lander.x += lander.vx * f;
            lander.y += lander.vy * f;

            if (lander.x < 0) lander.x = W;
            if (lander.x > W) lander.x = 0;

            updateLowFuelAlarm(f);

            // Smooth zoom toward altitude-based target (fixed landscape)
            updateZoom(f);

            checkCollision();
        }

        function checkCollision(opts) {
            const isDemo = !!(opts && opts.demo);
            const feetY = lander.y + landerFootDepth();
            const groundY = getTerrainHeight(lander.x);
            if (feetY < groundY) return;

            const half = landerHalfWidth();
            const left = lander.x - half;
            const right = lander.x + half;

            let onPad = false;
            let multiplier = 1;
            for (const pad of landingPads) {
                // Center must sit on the pad; most of the gear span must overlap
                // (narrow arcade pads are only slightly wider than the lander).
                if (lander.x < pad.x1 || lander.x > pad.x2) continue;
                const overlap = Math.min(right, pad.x2) - Math.max(left, pad.x1);
                if (overlap >= half * 1.35) {
                    onPad = true;
                    multiplier = pad.multiplier;
                    break;
                }
            }

            const vHud = Math.abs(lander.vy) * SPEED_SCALE;
            const hHud = Math.abs(lander.vx) * SPEED_SCALE;
            const upright = Math.abs(normalizeAngle(lander.rotation));

            lander.thrusting = false;
            lander.y = groundY - landerFootDepth();
            impactSpeeds = { h: Math.round(hHud), v: Math.round(vHud) };

            const softOk = onPad && upright < UPRIGHT_GREAT && vHud <= GREAT_V && hHud <= GREAT_H;
            const goodOk = onPad && upright < UPRIGHT_GOOD && vHud <= GOOD_V && hHud <= GOOD_H;
            const hardOk = onPad && upright < UPRIGHT_HARD && vHud <= HARD_V && hHud <= HARD_H;

            if (isDemo) {
                finishDemoTouchdown(!(softOk || goodOk || hardOk));
                return;
            }

            if (softOk) {
                const pts = BASE_LAND_POINTS * multiplier;
                score += pts;
                lander.fuel += GREAT_FUEL_BONUS;
                lander.vx = 0;
                lander.vy = 0;
                lander.rotation = 0;
                showMessage(pickMessage(SAFE_LAND_MSGS).concat(pts + ' POINTS'), 200);
                return;
            }

            if (goodOk) {
                const pts = BASE_LAND_POINTS * multiplier;
                score += pts;
                lander.fuel += GREAT_FUEL_BONUS;
                lander.vx = 0;
                lander.vy = 0;
                lander.rotation = 0;
                showMessage(pickMessage(SAFE_LAND_MSGS).concat(pts + ' POINTS'), 200);
                return;
            }

            if (hardOk) {
                const pts = HARD_POINTS * multiplier;
                score += pts;
                lander.vx = 0;
                lander.vy = 0;
                showMessage(pickMessage(HARD_LAND_MSGS).concat(pts + ' POINTS'), 200);
                return;
            }

            // Crash
            const lost = Math.floor(lander.fuel);
            spawnExplosion();
            score += CRASH_POINTS;
            lander.fuel = 0;
            lander.vx = 0;
            lander.vy = 0;
            showMessage(crashMessageLines(lost).concat(CRASH_POINTS + ' POINTS'), 220);
        }


        // --- SVG render (true vectors; viewBox scales without rasterizing) ---
        const svgNS = 'http://www.w3.org/2000/svg';
        const svg = document.getElementById('game');
        const el = {
            world: document.getElementById('world'),
            stars: document.getElementById('stars'),
            terrainLine: document.getElementById('terrainLine'),
            terrainDots: document.getElementById('terrainDots'),
            padLabels: document.getElementById('padLabels'),
            debrisLayer: document.getElementById('debrisLayer'),
            landerG: document.getElementById('landerG'),
            landerIcon: document.getElementById('landerIcon'),
            hud: document.getElementById('hud'),
            hudVectors: document.getElementById('hudVectors'),
            attract: document.getElementById('attract'),
            attractLander: document.getElementById('attractLander'),
            attractVectors: document.getElementById('attractVectors'),
            initialsEntry: document.getElementById('initialsEntry'),
            initialsVectors: document.getElementById('initialsVectors'),
            messages: document.getElementById('messages'),
            lowFuel: document.getElementById('lowFuel'),
            tip: document.getElementById('tip')
        };

        // Ed Logg–style stick font (unit cell 0..4 × 0..6, y down). Polylines per glyph.
